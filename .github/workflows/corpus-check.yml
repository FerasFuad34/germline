name: Corpus double-check

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "How many antibodies to check (1-100)"
        required: false
        default: "5"
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC — sample of 3

jobs:
  double-check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Docker availability
        run: docker version --format 'server {{.Server.Version}}' && df -h / | tail -1

      - name: Run corpus double-check
        run: |
          SAMPLE="${{ github.event.inputs.sample || '3' }}"
          bash tools/run-corpus-checks.sh --sample "$SAMPLE" --report out/verification.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: out/verification.json
          if-no-files-found: warn

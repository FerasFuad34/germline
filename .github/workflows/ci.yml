name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Prototype immune gate (simulation report)
        run: python3 prototype/immune_gate.py

      - name: Smoke-test the web service
        run: python3 tests/smoke_test.py

      - name: Install corpus/format tooling
        run: pip install pyyaml jsonschema

      - name: ABX conformance (RFC-0 Level 2 — schema + invariants)
        run: python3 tools/abx.py validate corpus/abx/*.abx.json

      - name: ABX drift check (documents must match their sources)
        run: python3 tools/abx.py convert --corpus corpus --out corpus/abx --check

      - name: Script hygiene — every shipped shell script must be executable
        run: |
          missing=0
          for f in tools/*.sh corpus/antibodies/*/double-check.sh; do
            [ -x "$f" ] || { echo "::error::not executable: $f"; missing=1; }
          done
          [ "$missing" = "0" ] || exit 1
          echo "all shipped scripts carry the executable bit"

      - name: Corpus check smoke (dry-run, no Docker)
        run: bash tools/run-corpus-checks.sh --dry-run

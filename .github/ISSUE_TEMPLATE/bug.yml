name: 🐞 Bug report
description: Something in the tooling (extractor / gate / docs) is broken
title: "[Bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (commands + output)
      placeholder: |
        $ germline-gate run --lineage lineage.json
        ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - GitHub Actions
        - Docker only
    validations:
      required: true
